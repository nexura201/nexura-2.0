<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nexura-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- N stylized with connection nodes -->
  <g transform="translate(40, 40)">
    <!-- Main N structure -->
    <path d="M 20 100 L 20 20 L 60 60 L 60 20" 
          stroke="url(#nexura-gradient)" 
          stroke-width="12" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Connection nodes -->
    <circle cx="20" cy="20" r="8" fill="#8B5CF6"/>
    <circle cx="20" cy="100" r="8" fill="#C4B5FD"/>
    <circle cx="60" cy="20" r="8" fill="#A78BFA"/>
    <circle cx="60" cy="60" r="8" fill="#8B5CF6"/>
    
    <!-- Signal waves -->
    <path d="M 80 40 Q 90 30, 100 40" 
          stroke="#A78BFA" 
          stroke-width="3" 
          fill="none" 
          opacity="0.6"/>
    <path d="M 80 50 Q 95 35, 110 50" 
          stroke="#A78BFA" 
          stroke-width="3" 
          fill="none" 
          opacity="0.4"/>
    <path d="M 80 60 Q 100 40, 120 60" 
          stroke="#A78BFA" 
          stroke-width="3" 
          fill="none" 
          opacity="0.2"/>
  </g>
</svg>
